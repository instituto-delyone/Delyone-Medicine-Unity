name = "medunity-sncr-api"
main = "src/index.js"
compatibility_date = "2026-10-20"

[vars]
SNCR_ENV = "homologacao"
# Set SNCR_FRONTEND_ORIGIN and SNCR_CALLBACK_URL to exact registered HTTPS URLs.
